# Modified from doctormord/SEN6X_ESPHOME (esphome_sen6x.yaml), GPL-3.0.
# Changes by Chris Ivarson, Nov 2026: adapted to the Adafruit 1.28" round display,
# ESP32-C3 SuperMini and Adafruit SEN6x breakout; reworked UI. See CHANGELOG.md.
# Real device: ESP32-C3 SuperMini + Adafruit 1.28" round TFT + SEN66 (via Adafruit breakout).
# Screen layout lives in common/aqs-ui.yaml. Flash with: esphome run aqs-sen6x-c3.yaml

substitutions:
  id_prefix: sen6x_c3
  node_name: aqs-sen6x-c3
  name: "Air Quality System"

  my_latitude: "30.2672"
  my_longitude: "-97.7431"

  pin_sda: 'GPIO06'
  pin_scl: 'GPIO07'
  pin_clk: 'GPIO08'
  pin_mosi: 'GPIO10'
  pin_reset: 'GPIO03'
  pin_cs: 'GPIO05'
  pin_dc: 'GPIO04'
  pin_backlight: 'GPIO02'
  pin_button: 'GPIO01'   # optional 12 mm tactile switch to GND

  # Picture rotation. Set to "180" on 2026-11-16 to match how the new
  # board is mounted. If it's ever upside down, change it back to "0".
  display_rotation: "180"

packages:
  ui: !include common/aqs-ui.yaml

globals:
  - id: system_ready
    type: bool
    initial_value: 'false'

esphome:
  name: ${node_name}
  # Shows in Home Assistant's device info as the firmware version
  project:
    name: "aqs.sen66-monitor"
    version: "build ${build_number}"
  includes:
    - "<esp_wifi.h>"
  platformio_options:
    board_build.f_cpu: 80000000L
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100% 
      - script.execute: apply_theme
      - wait_until: { time.has_time: }
      - script.execute: update_backlight

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_160: "n"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ: "80"

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  power_save_mode: LIGHT
  fast_connect: True
  output_power: 14dB
  # Match this to the network setup you made in the ESPHome builder
  networks:
    - id: legacy_wifi
      ssid: !secret wifi_legacy_ssid
      password: !secret wifi_password

  ap:
    password: !secret wifi_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

#external_components:
#  - source:
#      type: git
#      url: https://github.com/tuct/esphome-projects
#      path: components
#      ref: main
#    components: [ sen6x ]

binary_sensor:
  # Top button: tap = show device info for 30 s, hold 3 s = restart
  - platform: gpio
    id: user_button
    name: "Button"
    pin:
      number: ${pin_button}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_multi_click:
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.05s
        then:
          - script.execute: button_tap
      - timing:
          - ON for at least 3s
        then:
          - script.execute: show_restarting
          - delay: 1s
          - button.press: esphome_reboot_button
  - platform: template
    name: "SEN66 Ready"
    id: sensor_functional
    lambda: |-
      if (std::isnan(id(my_co2).state)) return false;
      return true;

logger:
  level: INFO

debug:

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  scan: true

spi:
  id: spi_bus
  clk_pin: ${pin_clk}
  mosi_pin: ${pin_mosi}

display:
  - platform: mipi_spi
    id: my_display
    model: GC9A01A
    spi_id: spi_bus
    cs_pin: ${pin_cs}
    dc_pin: ${pin_dc}
    reset_pin: ${pin_reset}
    data_rate: 20MHz
    dimensions:
      height: 240
      width: 240
    invert_colors: true

interval:
  # --- 1. SENSOR UPDATE ENGINE ---
  - interval: 1s
    id: interval_sensor_update
    then:
      - if:
          condition:
            lambda: |-
              static uint32_t last_sensor_update = 0;
              uint32_t now = millis();
              float s = id(sensor_update_slider).state;
              if (std::isnan(s) || s < 5) s = 30.0; 
              if (now - last_sensor_update >= (uint32_t)(s * 1000)) {
                last_sensor_update = now;
                return true; 
              }
              return false;
          then:
           - component.update: sen54

sensor:
  - platform: homeassistant
    id: printer_progress
    entity_id: sensor.prusa_core_one_progress
    internal: true

  - platform: sen6x
    id: sen54
    update_interval: 24h
    co2: { id: my_co2, name: "CO2" }
    pm_1_0: { id: my_pm1, name: "PM 1.0" }
    pm_2_5: { id: my_pm25, name: "PM 2.5" }
    pm_4_0: { id: my_pm4, name: "PM 4.0" }
    pm_10_0: { id: my_pm10, name: "PM 10" }
    voc_index: { id: my_voc, name: "VOC Index" }
    nox_index: { id: my_nox, name: "NOx Index" }
    temperature: { id: raw_temp, internal: true }
    humidity: { id: raw_hum, internal: true }
  - platform: template
    name: "Temperature"
    id: my_temp
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    # Sensor reports °C; convert, then apply the °F calibration offset
    lambda: "return id(raw_temp).state * 9.0 / 5.0 + 32.0 + id(offset_temp).state;"
  - platform: template
    name: "Humidity"
    id: my_hum
    unit_of_measurement: "%"
    lambda: |-
      float t_r = id(raw_temp).state;
      float t_c = t_r + id(offset_temp).state * 5.0 / 9.0;  // °F offset -> °C
      float rh = id(raw_hum).state * exp(17.62 * ((t_r / (243.12 + t_r)) - (t_c / (243.12 + t_c))));
      return clamp(rh + id(offset_hum).state, 0.0f, 100.0f);
  - platform: wifi_signal
    update_interval: 60s
    id: wifi_signal_db
    name: "WiFi Signal dBm"
    unit_of_measurement: "dBm"
    entity_category: diagnostic
    on_value_range:
      - below: -85.0
        then:
          - logger.log: "WiFi signal weak! Restarting to find a better network."
          - delay: 2s
          - button.press: esphome_reboot_button
  - platform: uptime
    update_interval: 60s
    name: "Uptime"
  - platform: copy
    source_id: wifi_signal_db
    id: wifi_signal_percent
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
  - platform: template
    name: "Heap Free Memory"
    id: heap_free
    unit_of_measurement: "B"
    update_interval: 60s
    lambda: |-
      return (float) esp_get_free_heap_size();
  - platform: template
    name: "Heap Largest Free Block"
    update_interval: 60s
    lambda: |-
      return (float) heap_caps_get_largest_free_block(MALLOC_CAP_DEFAULT);

text_sensor:
  # Prusa CORE One via Home Assistant's PrusaLink integration
  - platform: homeassistant
    id: printer_status
    entity_id: sensor.prusa_core_one
    internal: true
  - platform: homeassistant
    id: printer_finish
    entity_id: sensor.prusa_core_one_print_finish
    internal: true
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# --- DIE RETTUNG VOR DER 60-SEKUNDEN FLUT (update_interval: never) ---

button:
  - platform: restart
    id: esphome_reboot_button
    icon: mdi:power-cycle
    name: System Reboot
    entity_category: diagnostic

number:
  # --- EXISTING SYSTEM NUMBER SLIDERS ---
  - platform: template
    name: "Sensor Update Interval"
    id: sensor_update_slider
    entity_category: config
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    update_interval: never
  - platform: template
    name: "Calibration Temperature"
    id: offset_temp
    entity_category: config
    unit_of_measurement: "°F"
    min_value: -9.0
    max_value: 9.0
    initial_value: 0.0
    step: 0.1
    optimistic: true
    restore_value: true
    update_interval: never
  - platform: template
    name: "Calibration Humidity"
    id: offset_hum
    entity_category: config
    min_value: -10.0
    max_value: 10.0
    initial_value: 0.0
    step: 0.1
    optimistic: true
    restore_value: true
    update_interval: never

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    servers: ["0.us.pool.ntp.org", "1.us.pool.ntp.org", "time.google.com"]

output:
  - platform: ledc
    pin: ${pin_backlight}
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    internal: true
    default_transition_length: 1s
