    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
    on_value:
      - script.execute: update_backlight
  - platform: template
    name: "Sleep End"
    id: sleep_end
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    on_value:
      - script.execute: update_backlight

